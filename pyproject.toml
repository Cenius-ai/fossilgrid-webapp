[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fossilgrid"
version = "0.1.0"
description = "Stratigraphic column plotter, fossil ID key generator and site grid mapping tool"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["geology", "palaeontology", "stratigraphy", "identification-key", "field-notebook"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = []

[project.scripts]
fossilgrid = "fossilgrid:main"

[tool.setuptools]
py-modules = ["fossilgrid"]

[tool.pytest.ini_options]
testpaths = ["test_fossilgrid.py"]
